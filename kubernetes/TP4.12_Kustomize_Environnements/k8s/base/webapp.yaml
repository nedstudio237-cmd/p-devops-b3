apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels: {app: webapp}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # au plus 1 pod en plus pendant la mise à jour
      maxUnavailable: 0    # jamais moins de pods disponibles que "replicas"
  selector:
    matchLabels: {app: webapp}
  template:
    metadata:
      labels: {app: webapp}
    spec:
      containers:
        - name: webapp
          image: legeni-webapp              # tag fixé par chaque overlay (images:)
          ports:
            - containerPort: 5000
          readinessProbe:                     # prêt à recevoir du trafic ? (vérifie Redis)
            httpGet: {path: /ready, port: 5000}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:                      # processus vivant ? (sinon redémarrage)
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          envFrom:
            - configMapRef:
                name: webapp-config        # toutes les clés deviennent des variables d'env
            - secretRef:
                name: redis-secret         # REDIS_PASSWORD, lu par l'application
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  type: ClusterIP
  selector: {app: webapp}
  ports:
    - port: 80
      targetPort: 5000
