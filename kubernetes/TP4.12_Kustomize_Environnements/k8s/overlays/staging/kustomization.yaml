apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legeni-staging
resources:
  - ../../base
labels:
  - pairs:
      env: staging
images:
  - name: legeni-webapp
    newName: nedstudio/legeni-webapp
    newTag: "2.0.0"
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - APP_COLOR=#bf8700
