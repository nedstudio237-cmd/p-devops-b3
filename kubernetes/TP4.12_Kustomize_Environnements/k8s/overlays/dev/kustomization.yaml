# Défi TP 4.12 : overlay dev (image construite localement et chargée par minikube image load)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legeni-kdev
resources:
  - ../../base
labels:
  - pairs:
      env: dev
patches:
  - path: dev-patch.yaml
images:
  - name: legeni-webapp
    newName: nedstudio/legeni-webapp
    newTag: "2.0.0"
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_COLOR=#8250df
