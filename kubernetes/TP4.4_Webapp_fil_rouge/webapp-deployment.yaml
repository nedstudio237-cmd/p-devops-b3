apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp-container
          image: nedstudio/legeni-webapp:1.0.2     # image publiée par Jenkins (TP 3.5/3.6)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000            # gunicorn écoute sur 5000 (voir le Dockerfile)
          env:
            - name: APP_ENV
              value: "k8s-dev"
            - name: APP_COLOR
              value: "#2da44e"
