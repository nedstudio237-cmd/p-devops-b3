# Défi TP 4.13 : panne originale. Symptôme : le Pod est "Running" mais le site ne répond pas.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vitrine}
spec:
  replicas: 2
  selector: {matchLabels: {app: vitrine}}
  template:
    metadata: {labels: {app: vitrine}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: vitrine}
spec:
  selector: {app: vitrine}
  ports: [{port: 80, targetPort: 80}]
