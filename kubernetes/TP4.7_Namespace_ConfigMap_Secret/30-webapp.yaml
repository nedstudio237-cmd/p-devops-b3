apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: legeni-dev
  labels: {app: webapp, env: dev}
spec:
  replicas: 2
  selector:
    matchLabels: {app: webapp}
  template:
    metadata:
      labels: {app: webapp, env: dev}
    spec:
      containers:
        - name: webapp
          image: nedstudio/legeni-webapp:1.0.2
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: webapp-config        # toutes les clés deviennent des variables d'env
            - secretRef:
                name: redis-secret         # REDIS_PASSWORD, lu par l'application
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: legeni-dev
  labels: {env: dev}
spec:
  type: NodePort
  selector: {app: webapp}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
