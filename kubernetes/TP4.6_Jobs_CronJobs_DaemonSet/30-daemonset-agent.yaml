apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent-noeud
spec:
  selector:
    matchLabels:
      app: agent-noeud
  template:
    metadata:
      labels:
        app: agent-noeud
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane     # tourner aussi sur le nœud du plan de contrôle
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date) nœud=$NODE_NAME pods_logs=$(ls /var/log/pods | wc -l)\"; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName      # l'API "descendante" injecte le nom du nœud
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      volumes:
        - name: varlog
          hostPath:
            path: /var/log                      # les logs du nœud lui-même
